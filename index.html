<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Komari replaces the next two lines with the site name and description. Keep them verbatim. -->
    <title>Komari Monitor</title>
    <meta name="description" content="A simple server monitor tool." />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved appearance before first paint (key shared with Komari's default theme).
      // No value or blocked storage is dark (the default, as in src/lib/appearance.ts); 'system' follows the system.
      var a = null
      try {
        a = localStorage.getItem('appearance')
      } catch (e) {}
      var dark = a === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : a !== 'light'
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
