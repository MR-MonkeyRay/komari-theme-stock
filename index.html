<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Komari replaces the next two lines with the site name and description. Keep them verbatim. -->
    <title>Komari Monitor</title>
    <meta name="description" content="A simple server monitor tool." />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved appearance before first paint (key shared with Komari's default theme).
      try {
        var a = localStorage.getItem('appearance')
        var dark = a === 'dark' || ((!a || a === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
