name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # README promises Node 22+; 24 is the version releases are built with.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Check theme manifest
        id: meta
        run: npm run check:manifest

      - name: Lint
        run: npm run lint -- --deny-warnings

      - name: Type-check, build and package
        run: npm run package

      # The theme zip itself (not zip-in-zip), ready to upload in Komari's theme manager.
      - name: Upload theme package
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.meta.outputs.zip }}
          archive: false
          if-no-files-found: error
          retention-days: 14
